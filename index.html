<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7B1A2E" />

    <!-- Google Search Console verification
         Setea VITE_GSC_VERIFICATION en Pages env vars. Ejemplo valor:
         abc123_defg-456_hij789kl -->
    %VITE_GSC_META%

    <!-- Facebook / Meta domain verification (Business Manager) -->
    <meta name="facebook-domain-verification" content="evlb243pm2jvg6sshi04vudk1hgadn" />

    <!-- Meta Pixel Code (código base en el HTML para que las herramientas de
         Meta lo detecten y cargue lo antes posible). Los eventos de conversión
         se disparan aparte desde React (src/lib/metaPixel.js). -->
    <script>
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '2309058572967283');
      // No rastreamos el panel de administración.
      if (!location.pathname.startsWith('/admin')) fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=2309058572967283&ev=PageView&noscript=1" alt="" /></noscript>
    <!-- End Meta Pixel Code -->

    <link rel="icon" type="image/png" href="https://images.intimaexclusive.com/logo-intima.png" />
    <link rel="apple-touch-icon" href="https://images.intimaexclusive.com/logo-intima.png" />

    <link rel="preconnect" href="https://images.intimaexclusive.com" crossorigin />
    <link rel="preconnect" href="https://api.intimaexclusive.com" crossorigin />

    <!-- Fuentes editoriales para diseños demo -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Solo los pesos realmente usados: Playfair 400/700, Cormorant 300/400 + italic, Inter 400/600 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;600&display=swap" />

    <title>Íntima Exclusive — Lencería femenina premium hecha en Colombia</title>
    <meta name="description" content="Lencería íntima premium hecha con amor en Colombia. Sets, corsets, bodys y accesorios. Tallas S a XL. Envío discreto a todo el país, cambios hasta 30 días." />
    <!-- Canonical dinámico por ruta vía componente <Seo /> (React 19 metadata hoisting) -->
    <!-- NO agregar canonical estático aquí; sobreescribiría el canonical dinámico si el bot lee el HTML antes del JS -->

    <!-- Organization schema estático para que bots sin-JS (WhatsApp, Perplexity, CCBot) lo indexen -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Íntima Exclusive",
      "url": "https://intimaexclusive.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://images.intimaexclusive.com/LOGO-INTIMA.jpg"
      },
      "description": "Lencería íntima premium hecha con amor en Colombia. Sets, corsets, bodys y accesorios. Tallas S a XL.",
      "areaServed": { "@type": "Country", "name": "Colombia" },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+57-302-855-6022",
        "contactType": "customer service",
        "areaServed": "CO",
        "availableLanguage": ["es"]
      },
      "sameAs": [
        "https://www.instagram.com/intima_exclusive"
      ]
    }
    </script>

    <meta property="og:site_name" content="Íntima Exclusive" />

    <meta name="twitter:image" content="https://images.intimaexclusive.com/LOGO-INTIMA.jpg" />
    <!--app-head-->
  </head>

    <div id="root"><!--app-html--></div>
